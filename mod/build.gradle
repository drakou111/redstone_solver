plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

repositories {
	mavenCentral()
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"redstone_solver" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	// Development runs use the solver built in this repository.
	runs {
		configureEach {
			vmArg "-Dredstone.solver.exe=${rootProject.file('../build/msvc/Release/redstone_solver.exe').absolutePath}"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testImplementation "org.assertj:assertj-core:${project.assertj_version}"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
	// The end-to-end test starts the real solver when it has been built.
	systemProperty "redstone.solver.exe", rootProject.file("../build/msvc/Release/redstone_solver.exe").absolutePath
}
